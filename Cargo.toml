[package]
name = "remittance_stablecoin"
version = "0.1.0"
edition = "2024"
description = "Token-2022 remittance stablecoin: transfer fee, metadata pointer, default-frozen accounts, close authority, permanent delegate and confidential transfers."
publish = false

[workspace]
members = [".", "programs/agent"]
resolver = "3"

[dependencies]
# Token-2022 (instruction builders, extension state, StateWithExtensions)
spl-token-2022-interface = "3.1.2"
spl-token-metadata-interface = "1.0.1"
spl-associated-token-account-interface = "2.0.0"

# Confidential transfer proof tooling
solana-zk-sdk = "7.0.1"
solana-zk-sdk-pod = "0.1.2"
bytemuck = "1"
spl-token-confidential-transfer-proof-generation = "0.6.1"
spl-token-confidential-transfer-proof-extraction = "0.6.1"

# Core Solana types (versions line up with litesvm 0.18)
solana-address = "2.7"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-program-error = "3"
solana-compute-budget-interface = "3.1"
thiserror = "2"

[dev-dependencies]
litesvm = "0.18.1"
solana-account = "4.3"
solana-clock = "3.2"
solana-hash = "4.6"
solana-message = "4.2"
solana-rent = "4.4"
solana-transaction = "4.1"
solana-transaction-error = "3"
solana-instruction-error = "2"
solana-program-pack = "3"

# Zero-knowledge proof generation and the in-process VM are far too slow
# unoptimised; optimising dependencies only keeps incremental builds of this
# crate quick while making `cargo test` practical.
[profile.dev.package."*"]
opt-level = 3
